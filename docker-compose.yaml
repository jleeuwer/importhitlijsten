services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: hitlijsten
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgres://postgres:postgres@db:5432/hitlijsten
      LOG_LEVEL: info
      CORS_ORIGIN: "*"
    ports:
      - "3003:3003"
    depends_on:
      - db

volumes:
  pgdata:
